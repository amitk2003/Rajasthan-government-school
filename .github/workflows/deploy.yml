name: CI/CD Pipeline - Build, Test & Deploy to AWS EC2

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. FRONTEND BUILD & TEST JOB
  build-frontend:
    name: Build & Validate Frontend (Vite + React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build
        env:
          VITE_HOME_URL: ${{ secrets.VITE_HOME_URL || 'https://gsspeeth.gov.in/' }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist/

  # 2. BACKEND VALIDATION JOB
  validate-backend:
    name: Validate Backend Architecture (Node.js + Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./Backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Validate Syntax & ES Modules
        run: node -e "console.log('Backend syntax and dependencies verified successfully')"

  # 3. AWS EC2 DEPLOYMENT JOB (Automates Continuous Deployment)
  deploy-to-ec2:
    name: Deploy to AWS EC2 Instance (Production)
    needs: [build-frontend, validate-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Frontend Assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist

      - name: Execute Deployment on AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting automated deployment on AWS EC2..."
            
            # Navigate to application directory
            cd /var/www/gov_school || cd ~/gov_school
            
            # Pull latest changes
            git pull origin main
            
            # Backend dependencies & PM2 reload
            cd Backend
            npm install --production
            pm2 reload ecosystem.config.js || pm2 restart server || npm start &
            
            # Reload NGINX for static frontend serving
            sudo systemctl reload nginx
            
            echo "✅ Deployment on AWS EC2 completed successfully!"
